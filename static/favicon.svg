<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A18"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#CFF9FE"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Outer Sci-Fi Hexagonal Ring -->
  <polygon points="32,8 52,19.5 52,42.5 32,54 12,42.5 12,19.5" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="8 3" />

  <!-- Inner Hexagon Frame -->
  <polygon points="32,12 48,21.2 48,40.8 32,50 16,40.8 16,21.2" fill="#040D1F" fill-opacity="0.8" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Stylized Sci-Fi "T" Core -->
  <!-- Top Bar of T -->
  <path d="M22 22 L42 22 L40 27 L35 27 L35 44 L29 44 L29 27 L24 27 Z" fill="url(#tGrad)" filter="url(#glow)"/>
  
  <!-- Cyan Accent Core Line in T -->
  <path d="M24 23.5 L40 23.5" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M32 27 L32 42" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Orbital Energy Nodes -->
  <circle cx="32" cy="8" r="1.8" fill="#00F0FF" />
  <circle cx="52" cy="42.5" r="1.5" fill="#38BDF8" />
  <circle cx="12" cy="19.5" r="1.5" fill="#6366F1" />
</svg>
