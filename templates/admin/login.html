<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — TRAIT Innovation</title>
  {% include 'components/favicon.html' %}
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            trait: {
              950: '#030611',
              900: '#060B1C',
              800: '#0B1530',
              700: '#12224A',
              cyan: '#00F0FF',
              blue: '#3B82F6',
              indigo: '#6366F1'
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030611;
      color: #F8FAFC;
      overflow-x: hidden;
    }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass-card {
      background: rgba(6, 11, 28, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 240, 255, 0.22);
    }
    .glow-cyan {
      box-shadow: 0 0 40px -10px rgba(0, 240, 255, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative selection:bg-cyan-500 selection:text-black">

  <!-- Ambient Background Sci-Fi Glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-400/15 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/10 rounded-full blur-[160px]"></div>
  </div>

  <div class="max-w-md w-full relative z-10">

    <!-- Top Brand Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3 group">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 p-2.5 shadow-xl shadow-cyan-500/20 group-hover:scale-105 transition-transform flex items-center justify-center">
          <svg class="w-full h-full text-white" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7V17L12 22L21 17V7L12 2Z" stroke="currentColor" stroke-width="2"/>
            <path d="M12 22V12" stroke="currentColor" stroke-width="2"/>
            <path d="M12 12L21 7" stroke="currentColor" stroke-width="2"/>
            <path d="M12 12L3 7" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="text-left">
          <span class="font-display font-black text-xl tracking-tight text-white uppercase block leading-tight">
            TRAIT <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">INNOVATION</span>
          </span>
          <span class="text-[9px] font-mono text-cyan-400 tracking-widest uppercase font-bold">
            EXECUTIVE CONTROL CONSOLE
          </span>
        </div>
      </a>
    </div>

    <!-- Login Card Container -->
    <div class="glass-card glow-cyan rounded-3xl p-8 shadow-2xl relative overflow-hidden">
      
      <!-- Top Neon Header Accent Line -->
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 via-cyan-400 to-indigo-600"></div>

      <!-- Mode Selector Switcher Tabs -->
      <div class="flex p-1 mb-6 rounded-2xl bg-trait-900 border border-slate-800 text-xs font-semibold">
        <button id="tab-login" onclick="switchMode('login')" class="flex-1 py-2.5 rounded-xl transition-all duration-200 bg-gradient-to-r from-blue-600 to-cyan-500 text-slate-950 font-bold shadow-md">
          Sign In
        </button>
        <button id="tab-forgot" onclick="switchMode('forgot')" class="flex-1 py-2.5 rounded-xl text-slate-400 hover:text-white transition-all duration-200 font-medium">
          Forgot Password
        </button>
      </div>

      <!-- Alert Notification Banner -->
      <div id="alert-banner" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-medium flex items-center gap-2.5 border">
        <span id="alert-icon" class="text-base shrink-0">⚠️</span>
        <span id="alert-text" class="flex-1 leading-relaxed"></span>
      </div>

      <!-- 1. SIGN IN FORM -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1.5 font-bold">
            Administrator ID
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="login-username" 
              name="username"
              required 
              autocomplete="username"
              placeholder="Enter administrator ID" 
              class="w-full px-4 py-3.5 rounded-2xl bg-trait-900/90 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-medium"
            />
            <span class="absolute right-4 top-3.5 text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] font-mono uppercase tracking-wider text-slate-400 font-bold">
              Password
            </label>
            <button type="button" onclick="switchMode('forgot')" class="text-[11px] font-medium text-cyan-400 hover:text-cyan-300 transition-colors">
              Forgot?
            </button>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="login-password" 
              name="password"
              required 
              autocomplete="current-password"
              placeholder="••••••••••••" 
              class="w-full px-4 py-3.5 rounded-2xl bg-trait-900/90 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono"
            />
            <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute right-4 top-3.5 text-slate-400 hover:text-white transition-colors" title="Toggle visibility">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="btn-login"
          class="w-full py-4 mt-2 rounded-2xl bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-cyan-500/20 active:scale-[0.99] transition-all cursor-pointer flex items-center justify-center gap-2"
        >
          <span>Access Control Console</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- 2. FORGOT PASSWORD / SECURITY RECOVERY FORM -->
      <form id="forgot-form" onsubmit="handleForgotSubmit(event)" class="hidden space-y-4">
        
        <div class="p-3.5 rounded-2xl bg-trait-900 border border-cyan-500/30 text-xs">
          <span class="font-mono text-[10px] text-cyan-400 uppercase tracking-wider block font-bold mb-1">
            SECURITY RECOVERY VERIFICATION
          </span>
          <p class="text-slate-300 font-semibold text-sm">
            Question: <span class="text-white">Who built this site?</span>
          </p>
        </div>

        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1.5 font-bold">
            Security Answer / Verification Key
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="security-answer" 
              required 
              placeholder="Enter confidential answer" 
              class="w-full px-4 py-3.5 rounded-2xl bg-trait-900/90 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono"
            />
            <button type="button" onclick="togglePasswordVisibility('security-answer')" class="absolute right-4 top-3.5 text-slate-400 hover:text-white transition-colors" title="Toggle visibility">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1.5 font-bold">
            New Admin Password
          </label>
          <input 
            type="password" 
            id="new-password" 
            required 
            minlength="4"
            placeholder="Create new secure password" 
            class="w-full px-4 py-3.5 rounded-2xl bg-trait-900/90 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono"
          />
        </div>

        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-slate-400 mb-1.5 font-bold">
            Confirm New Password
          </label>
          <input 
            type="password" 
            id="confirm-password" 
            required 
            placeholder="Confirm new password" 
            class="w-full px-4 py-3.5 rounded-2xl bg-trait-900/90 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all font-mono"
          />
        </div>

        <button 
          type="submit" 
          id="btn-recovery"
          class="w-full py-4 mt-2 rounded-2xl bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-500 hover:from-emerald-500 hover:to-cyan-400 text-white font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-emerald-500/20 active:scale-[0.99] transition-all cursor-pointer flex items-center justify-center gap-2"
        >
          <span>Verify & Update Password</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
        </button>

      </form>

      <!-- Back to Website Footer -->
      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <a href="/" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors inline-flex items-center gap-1.5 font-medium">
          <span>← Back to Public Website</span>
        </a>
      </div>

    </div>

    <!-- Security Footnote -->
    <p class="text-center text-[10px] text-slate-600 mt-6 font-mono tracking-wider">
      ENCRYPTED ACCESS • TRAIT INNOVATION SECURITY SUBSYSTEM
    </p>

  </div>

  <script>
    function switchMode(mode) {
      hideAlert();
      const tabLogin = document.getElementById('tab-login');
      const tabForgot = document.getElementById('tab-forgot');
      const formLogin = document.getElementById('login-form');
      const formForgot = document.getElementById('forgot-form');

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-2.5 rounded-xl transition-all duration-200 bg-gradient-to-r from-blue-600 to-cyan-500 text-slate-950 font-bold shadow-md';
        tabForgot.className = 'flex-1 py-2.5 rounded-xl text-slate-400 hover:text-white transition-all duration-200 font-medium';
        formLogin.classList.remove('hidden');
        formForgot.classList.add('hidden');
      } else {
        tabForgot.className = 'flex-1 py-2.5 rounded-xl transition-all duration-200 bg-gradient-to-r from-emerald-500 to-cyan-400 text-slate-950 font-bold shadow-md';
        tabLogin.className = 'flex-1 py-2.5 rounded-xl text-slate-400 hover:text-white transition-all duration-200 font-medium';
        formForgot.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
      }
    }

    function showAlert(type, message) {
      const banner = document.getElementById('alert-banner');
      const icon = document.getElementById('alert-icon');
      const text = document.getElementById('alert-text');
      
      banner.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-300', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
      
      if (type === 'error') {
        banner.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
        icon.textContent = '✕';
      } else {
        banner.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
        icon.textContent = '✓';
      }
      text.textContent = message;
    }

    function hideAlert() {
      document.getElementById('alert-banner').classList.add('hidden');
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('btn-login');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">◌</span> Verifying...`;

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert('success', 'Authentication successful. Redirecting to console...');
          setTimeout(() => {
            window.location.href = data.redirect || '/admin/dashboard';
          }, 600);
        } else {
          showAlert('error', data.message || 'Invalid administrator ID or password.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        showAlert('error', 'Network error or service unavailable. Please try again.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    async function handleForgotSubmit(e) {
      e.preventDefault();
      hideAlert();
      const answer = document.getElementById('security-answer').value.trim();
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (newPass !== confirmPass) {
        showAlert('error', 'New passwords do not match. Please verify.');
        return;
      }
      if (newPass.length < 4) {
        showAlert('error', 'Password must be at least 4 characters.');
        return;
      }

      const btn = document.getElementById('btn-recovery');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">◌</span> Validating Answer...`;

      try {
        const res = await fetch('/admin/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            answer: answer,
            new_password: newPass
          })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert('success', 'Security answer confirmed! Password updated. Entering console...');
          setTimeout(() => {
            window.location.href = data.redirect || '/admin/dashboard';
          }, 800);
        } else {
          showAlert('error', data.message || 'Incorrect security answer. Access denied.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        showAlert('error', 'Network communication error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>

</body>
</html>
