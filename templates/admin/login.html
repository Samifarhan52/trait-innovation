<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In ‹ TRAIT Innovation — WordPress Administration</title>
  {% include 'components/favicon.html' %}
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --wp-admin-bg: #f0f0f1;
      --wp-card-bg: #ffffff;
      --wp-border: #c3c4c7;
      --wp-input-border: #8c8f94;
      --wp-blue: #2271b1;
      --wp-blue-hover: #135e96;
      --wp-blue-focus: #0a4b78;
      --wp-text-dark: #1d2327;
      --wp-text-body: #2c3338;
      --wp-text-muted: #646970;
      --wp-error-border: #d63638;
      --wp-success-border: #00a32a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: var(--wp-admin-bg);
      color: var(--wp-text-body);
      min-height: 100vh;
    }
    .wp-input {
      background: #ffffff;
      border: 1px solid var(--wp-input-border);
      border-radius: 4px;
      color: var(--wp-text-body);
      font-size: 14px;
      line-height: 1.4;
      padding: 8px 12px;
      width: 100%;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .wp-input:focus {
      border-color: var(--wp-blue);
      box-shadow: 0 0 0 1px var(--wp-blue);
      outline: 2px solid transparent;
    }
    .wp-btn-primary {
      background: var(--wp-blue);
      border: 1px solid var(--wp-blue);
      border-radius: 4px;
      color: #ffffff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      line-height: 2.15384615;
      min-height: 32px;
      padding: 0 16px;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
    }
    .wp-btn-primary:hover {
      background: var(--wp-blue-hover);
      border-color: var(--wp-blue-hover);
      color: #ffffff;
    }
    .wp-btn-primary:active {
      background: var(--wp-blue-focus);
      border-color: var(--wp-blue-focus);
    }
    .wp-notice {
      background: #ffffff;
      border-left: 4px solid var(--wp-blue);
      box-shadow: 0 1px 1px 0 rgba(0,0,0,0.05);
      padding: 12px;
      font-size: 13px;
    }
    .wp-notice-error {
      border-left-color: var(--wp-error-border);
    }
    .wp-notice-success {
      border-left-color: var(--wp-success-border);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen">

  <div class="w-full max-w-[360px]">

    <!-- WordPress / Brand Header Logo -->
    <div class="text-center mb-6">
      <a href="/" class="inline-flex flex-col items-center gap-2 group">
        <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-700/60 p-3 shadow-md flex items-center justify-center group-hover:scale-105 transition-transform">
          <svg class="w-full h-full text-blue-400" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7V17L12 22L21 17V7L12 2Z" stroke="currentColor" stroke-width="2"/>
            <path d="M12 22V12" stroke="currentColor" stroke-width="2"/>
            <path d="M12 12L21 7" stroke="currentColor" stroke-width="2"/>
            <path d="M12 12L3 7" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="mt-1">
          <span class="text-xl font-bold text-slate-900 tracking-tight block">
            TRAIT INNOVATION
          </span>
          <span class="text-xs text-slate-500 font-normal">
            WordPress Administration Console
          </span>
        </div>
      </a>
    </div>

    <!-- Mode Selector Sub-bar (Log In / Lost Password) -->
    <div class="flex border-b border-slate-300 mb-4 bg-white rounded-t border-t border-x">
      <button 
        id="tab-login" 
        onclick="switchMode('login')" 
        class="flex-1 py-2.5 px-3 text-xs font-semibold text-center border-b-2 border-[#2271b1] text-[#2271b1] bg-white transition-all"
      >
        Sign In
      </button>
      <button 
        id="tab-forgot" 
        onclick="switchMode('forgot')" 
        class="flex-1 py-2.5 px-3 text-xs font-medium text-center text-slate-500 hover:text-slate-800 bg-slate-50 transition-all border-b-2 border-transparent"
      >
        Lost Password?
      </button>
    </div>

    <!-- Alert Banner -->
    <div id="alert-banner" class="hidden mb-4 wp-notice">
      <div class="flex items-center gap-2">
        <span id="alert-icon" class="font-bold text-sm"></span>
        <span id="alert-text" class="flex-1"></span>
      </div>
    </div>

    <!-- Main Clean Card Box (WordPress wp-login.php box) -->
    <div class="bg-white border border-[#c3c4c7] shadow-[0_1px_3px_rgba(0,0,0,0.04)] rounded p-6">

      <!-- 1. LOGIN FORM -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label for="login-username" class="block text-xs font-semibold text-[#1d2327] mb-1.5">
            Username or Email Address
          </label>
          <input 
            type="text" 
            id="login-username" 
            name="username"
            required 
            autocomplete="username"
            class="wp-input"
            value="Traitinnovation"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="text-xs font-semibold text-[#1d2327]">
              Password
            </label>
            <button type="button" onclick="switchMode('forgot')" class="text-xs text-[#2271b1] hover:underline">
              Lost your password?
            </button>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="login-password" 
              name="password"
              required 
              autocomplete="current-password"
              class="wp-input pr-10"
              placeholder="••••••••••••"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('login-password')" 
              class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-700" 
              title="Toggle visibility"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center text-xs text-[#646970] cursor-pointer">
            <input type="checkbox" checked class="rounded border-slate-300 text-[#2271b1] focus:ring-[#2271b1] mr-1.5" />
            Remember Me
          </label>
          <button 
            type="submit" 
            id="btn-login"
            class="wp-btn-primary px-5 py-1.5"
          >
            Log In
          </button>
        </div>
      </form>

      <!-- 2. FORGOT PASSWORD / SECURITY RECOVERY FORM -->
      <form id="forgot-form" onsubmit="handleForgotSubmit(event)" class="hidden space-y-4">
        
        <div class="bg-amber-50 border-l-4 border-amber-500 p-3 text-xs rounded-r">
          <p class="font-semibold text-amber-900 mb-0.5">Security Recovery Protocol</p>
          <p class="text-amber-800">
            Security Question: <strong>Who built this site?</strong>
          </p>
        </div>

        <div>
          <label for="security-answer" class="block text-xs font-semibold text-[#1d2327] mb-1.5">
            Security Answer
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="security-answer" 
              required 
              placeholder="Enter confidential answer" 
              class="wp-input pr-10"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('security-answer')" 
              class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-700" 
              title="Toggle visibility"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label for="new-password" class="block text-xs font-semibold text-[#1d2327] mb-1.5">
            New Admin Password
          </label>
          <input 
            type="password" 
            id="new-password" 
            required 
            minlength="4"
            placeholder="Create new secure password" 
            class="wp-input"
          />
        </div>

        <div>
          <label for="confirm-password" class="block text-xs font-semibold text-[#1d2327] mb-1.5">
            Confirm New Password
          </label>
          <input 
            type="password" 
            id="confirm-password" 
            required 
            placeholder="Confirm new password" 
            class="wp-input"
          />
        </div>

        <div class="flex items-center justify-between pt-2">
          <button 
            type="button" 
            onclick="switchMode('login')"
            class="text-xs text-[#2271b1] hover:underline"
          >
            ← Back to Log In
          </button>
          <button 
            type="submit" 
            id="btn-recovery"
            class="wp-btn-primary px-4 py-1.5"
          >
            Reset Password
          </button>
        </div>

      </form>

    </div>

    <!-- Classic WordPress Bottom Navigation Links -->
    <div class="mt-4 px-2 flex items-center justify-between text-xs text-[#646970]">
      <a href="/" class="hover:text-[#2271b1] transition-colors flex items-center gap-1">
        <span>←</span> Go to Trait Innovation
      </a>
      <span class="text-[11px] text-slate-400">
        Privacy & Security
      </span>
    </div>

  </div>

  <script>
    function switchMode(mode) {
      hideAlert();
      const tabLogin = document.getElementById('tab-login');
      const tabForgot = document.getElementById('tab-forgot');
      const formLogin = document.getElementById('login-form');
      const formForgot = document.getElementById('forgot-form');

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-2.5 px-3 text-xs font-semibold text-center border-b-2 border-[#2271b1] text-[#2271b1] bg-white transition-all';
        tabForgot.className = 'flex-1 py-2.5 px-3 text-xs font-medium text-center text-slate-500 hover:text-slate-800 bg-slate-50 transition-all border-b-2 border-transparent';
        formLogin.classList.remove('hidden');
        formForgot.classList.add('hidden');
      } else {
        tabForgot.className = 'flex-1 py-2.5 px-3 text-xs font-semibold text-center border-b-2 border-[#2271b1] text-[#2271b1] bg-white transition-all';
        tabLogin.className = 'flex-1 py-2.5 px-3 text-xs font-medium text-center text-slate-500 hover:text-slate-800 bg-slate-50 transition-all border-b-2 border-transparent';
        formForgot.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
      }
    }

    function showAlert(type, message) {
      const banner = document.getElementById('alert-banner');
      const icon = document.getElementById('alert-icon');
      const text = document.getElementById('alert-text');
      
      banner.classList.remove('hidden', 'wp-notice-error', 'wp-notice-success');
      
      if (type === 'error') {
        banner.classList.add('wp-notice-error');
        icon.textContent = 'ERROR:';
      } else {
        banner.classList.add('wp-notice-success');
        icon.textContent = 'SUCCESS:';
      }
      text.textContent = message;
    }

    function hideAlert() {
      document.getElementById('alert-banner').classList.add('hidden');
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      hideAlert();
      const btn = document.getElementById('btn-login');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `Logging In...`;

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert('success', 'Authentication successful. Redirecting to dashboard...');
          setTimeout(() => {
            window.location.href = data.redirect || '/admin/dashboard';
          }, 400);
        } else {
          showAlert('error', data.message || 'Invalid administrator ID or password.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        showAlert('error', 'Network error or service unavailable. Please try again.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    async function handleForgotSubmit(e) {
      e.preventDefault();
      hideAlert();
      const answer = document.getElementById('security-answer').value.trim();
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (newPass !== confirmPass) {
        showAlert('error', 'New passwords do not match. Please verify.');
        return;
      }
      if (newPass.length < 4) {
        showAlert('error', 'Password must be at least 4 characters.');
        return;
      }

      const btn = document.getElementById('btn-recovery');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `Validating...`;

      try {
        const res = await fetch('/admin/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            answer: answer,
            new_password: newPass
          })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          showAlert('success', 'Security answer confirmed! Password updated. Entering dashboard...');
          setTimeout(() => {
            window.location.href = data.redirect || '/admin/dashboard';
          }, 600);
        } else {
          showAlert('error', data.message || 'Incorrect security answer. Access denied.');
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      } catch (err) {
        showAlert('error', 'Network communication error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>

</body>
</html>
