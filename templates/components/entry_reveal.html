        if (isDismissed) return;
        isDismissed = true;

        if (overlay) {
          overlay.classList.add('trait-reveal-exit');

                overlay.parentNode.removeChild(overlay);
              }

        }

      // 1. Skip Button Click

        skipBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          dismissIntro();
        });
      }

      // 2. Keyboard Accessibility (Escape or Space to Skip)
      function onKeyDown(e) {
        if (e.key === 'Escape' || e.key === ' ' || e.keyCode === 27 || e.keyCode === 32) {
          dismissIntro();
          window.removeEventListener('keydown', onKeyDown);
        }
      }
      window.addEventListener('keydown', onKeyDown);

      // 3. Web Audio Synthesizer (High-Tech Cinematic Acoustic Swell synced to 1.35s apex)

        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === 'suspended') {
            ctx.resume();
          }

          // Sub-bass resonance (40Hz -> 85Hz)
          var osc1 = ctx.createOscillator();
          var gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(42, ctx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(84, ctx.currentTime + 1.2);

          gain1.gain.setValueAtTime(0.001, ctx.currentTime);
          gain1.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.6);
          gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.4);

          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start();
          osc1.stop(ctx.currentTime + 2.5);

          // Crystalline Shimmer Harmonic at 1.35s apex
          setTimeout(function() {
            try {
              var osc2 = ctx.createOscillator();
              var gain2 = ctx.createGain();
              osc2.type = 'triangle';
              osc2.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
              osc2.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.8); // C6

              gain2.gain.setValueAtTime(0.001, ctx.currentTime);
              gain2.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.25);
              gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

              osc2.connect(gain2);
              gain2.connect(ctx.destination);
              osc2.start();
              osc2.stop(ctx.currentTime + 1.6);
            } catch (err) {}
          }, 1300);

        } catch (e) {
          // Autoplay restrictions safely caught
        }
      }

      // Attempt subtle sound if interaction or permitted
      try {
        triggerAcousticSwell();
